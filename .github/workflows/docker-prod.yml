name: Docker CI/CD - Production

on:
  push:
    # Hanya trigger saat push Git Tag semver resmi (contoh: v1.0.0, v2.1.7)
    # Tag dengan prefix dev (seperti dev-v1.0.0) TIDAK akan memicu workflow ini
    tags:
      - 'v*.*.*'
  # Memungkinkan trigger manual dari tab Actions di GitHub
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # JOB 1: CI (Build & Push Docker Image Prod)
  # ==========================================
  build-and-push-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Konfigurasi tag resmi Production
      # Hasil tag: 2.1.7, 2.1, latest, prod-<sha>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Versi penuh (contoh: 2.1.7)
            type=semver,pattern={{version}}
            # Versi major.minor (contoh: 2.1)
            type=semver,pattern={{major}}.{{minor}}
            # Tag latest untuk rilisan production stabil
            type=raw,value=latest
            # Commit hash produksi (contoh: prod-a1b2c3d)
            type=sha,prefix=prod-

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: CD (Deploy ke Server Production)
  # ==========================================
  deploy-prod:
    needs: build-and-push-prod
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script: |
            echo "Deploying to Production Server..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ secrets.PROD_APP_PATH || '/var/www/prod-app' }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "Production deployment completed successfully!"

