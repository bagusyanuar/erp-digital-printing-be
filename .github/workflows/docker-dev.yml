name: Docker CI - Development

on:
  push:
    # Trigger HANYA via Git Tag dev (contoh: dev-v1.0.0 atau dev-1.0.0)
    tags:
      - 'dev-*'
      - 'dev-v*.*.*'
  # Memungkinkan trigger manual dari tab Actions di GitHub
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # CI: Build & Push Docker Image Dev ke GHCR
  # ==========================================
  build-and-push-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Konfigurasi tag khusus Development
      # Hasil tag: dev-latest, dev-<sha>, dev-<version>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag statis untuk image dev paling baru
            type=raw,value=dev-latest
            # Tag commit hash unik untuk dev (contoh: dev-a1b2c3d)
            type=sha,prefix=dev-
            # Jika trigger via Git Tag: dev-v1.0.0 -> image tag: dev-1.0.0
            type=match,pattern=dev-v(.*),group=1,prefix=dev-

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: CD (Deploy ke Server Development)
  # ==========================================
  deploy-dev:
    needs: build-and-push-dev
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Development Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT || 22 }}
          script: |
            echo "Deploying Backend to Dev Server..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ secrets.DEV_APP_PATH || '/home/dystopia/erp-digital-printing-deployment' }}
            docker compose pull app
            docker compose up -d app
            echo "Running database migrations..."
            docker compose exec -T app sh -c './migrate -path ./migrations -database "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME}?sslmode=${DB_SSLMODE:-disable}" up'
            docker image prune -f
            echo "Backend development deployment completed successfully!"

