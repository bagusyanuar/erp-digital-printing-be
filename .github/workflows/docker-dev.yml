name: Docker CI - Development

on:
  push:
    # Trigger ketika push/merge ke branch develop atau dev
    branches:
      - develop
      - dev
    # Atau jika ingin trigger via tag dev manual (contoh: dev-v1.0.0 atau dev-1.0)
    tags:
      - 'dev-*'
      - 'dev-v*.*.*'
  # Memungkinkan trigger manual dari tab Actions di GitHub
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # CI: Build & Push Docker Image Dev ke GHCR
  # ==========================================
  build-and-push-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Konfigurasi tag khusus Development
      # Hasil tag: dev-latest, dev-<sha>, dev-<version>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag statis untuk image dev paling baru
            type=raw,value=dev-latest
            # Tag commit hash unik untuk dev (contoh: dev-a1b2c3d)
            type=sha,prefix=dev-
            # Jika trigger via Git Tag: dev-v1.0.0 -> image tag: dev-1.0.0
            type=match,pattern=dev-v(.*),group=1,prefix=dev-
            # Jika trigger via branch: dev-develop atau dev-dev
            type=ref,event=branch,prefix=dev-

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

